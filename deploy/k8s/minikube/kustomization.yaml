apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smart-imaging
resources:
  - namespace.yaml
  - ../base
images:
  - name: smart-imaging-proxy
    newName: smart-imaging-proxy
    newTag: local
configMapGenerator:
  - name: smart-imaging-config
    literals:
      - DEMO_PUBLIC_URL=https://imaging-local.argo.run
patches:
  - target: { kind: Ingress, name: smart-imaging }
    patch: |
      - { op: replace, path: /spec/tls/0/hosts/0, value: imaging-local.argo.run }
      - { op: replace, path: /spec/rules/0/host, value: imaging-local.argo.run }
