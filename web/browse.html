<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse Studies</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='3' fill='%230f2a3d'/%3E%3Cellipse cx='10' cy='10' rx='4.5' ry='6' fill='%23e8f1f6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <a class="mark" href="/"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><ellipse cx="10" cy="10" rx="4" ry="5.5" fill="currentColor"/></svg>SMART Imaging</a>
  <nav class="pages" aria-label="Pages"><a href="/">Overview</a><a href="/browse" aria-current="page">Browse studies</a><a class="live-link" id="live-link" href="#" target="smart-imaging-live" rel="noopener">Live trace ↗</a><a href="/admin">Admin</a></nav>
  <div class="bar-status"><span id="store-badge" class="store-badge" role="status"></span><label class="backend">Images from <select id="backend"></select><span id="backend-status"></span></label></div>
</header>
<main class="browse">
  <section class="pick" aria-labelledby="h-pick">
    <h2 id="h-pick">See studies as</h2>
    <p id="store-note" class="store-note" hidden></p>
    <div id="pick"><p class="note">Loading the accounts…</p></div>
  </section>
  <section class="results" id="results" aria-labelledby="h-results">
    <h2 id="h-results" tabindex="-1">Studies</h2>
    <p id="announce" class="sr-only" role="status"></p>
    <div id="result"><div class="viewbox-empty"><p>Pick someone, and their studies go up here, from a real sign-in and a real search.</p><div class="ghosts" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div></div>
  </section>
</main>
<script src="/browse.js"></script>
</body>
</html>
