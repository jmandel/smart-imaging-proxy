# Backends for the demo. Storage is under /tmp by default, so it is disposable.
name: smart-imaging-sandbox
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: demo-minio
      MINIO_ROOT_PASSWORD: demo-minio-secret
    ports: ["127.0.0.1:${MINIO_PORT:-4610}:9000"]
    volumes: ["${DEMO_STORAGE:-/tmp/smart-imaging-demo}/minio:/data"]
  orthanc:
    image: orthancteam/orthanc:latest
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"demo-proxy":"demo-orthanc-secret"}'
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: /dicom-web/
    ports: ["127.0.0.1:${ORTHANC_PORT:-4611}:8042"]
    volumes: ["${DEMO_STORAGE:-/tmp/smart-imaging-demo}/orthanc:/var/lib/orthanc/db"]
